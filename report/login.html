<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Restock report · Sign in</title>
<style>
  :root { --bg:#f6f5f3; --card:#fff; --text:#1d1b19; --muted:#6b665f; --line:#e3dfd9; --accent:#b0124a; --err:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151413; --card:#1f1d1b; --text:#f2efeb; --muted:#a39d95; --line:#34312d; --accent:#e0457b; --err:#ff7a6e; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:16px; }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p { margin:0 0 20px; color:var(--muted); }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { margin-top:16px; width:100%; font:inherit; font-weight:600; padding:11px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:var(--err); margin-top:12px; min-height:1.5em; }
</style>
</head>
<body>
<form id="f">
  <h1>Restock report</h1>
  <p>Hera Beauté · head office</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button id="b" type="submit">Sign in</button>
  <div class="err" id="e" role="alert"></div>
</form>
<script>
  document.getElementById('f').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const b = document.getElementById('b'), e = document.getElementById('e');
    b.disabled = true; e.textContent = '';
    try {
      const r = await fetch('/report/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
      const d = await r.json().catch(() => ({}));
      if (r.ok) { location.reload(); return; }
      e.textContent = d.error || 'Sign-in failed';
    } catch { e.textContent = 'Network error, please try again.'; }
    b.disabled = false;
  });
</script>
</body>
</html>
