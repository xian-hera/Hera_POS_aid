<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Restock report</title>
<style>
  :root {
    --bg:#f6f5f3; --card:#fff; --text:#1d1b19; --muted:#6b665f; --line:#e3dfd9; --soft:#f1eeea;
    --accent:#b0124a; --accent-soft:#fbe9ef; --ok:#1e7a46; --ok-soft:#e6f4ec; --warn:#9a5b00; --err:#b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151413; --card:#1f1d1b; --text:#f2efeb; --muted:#a39d95; --line:#34312d; --soft:#272421;
            --accent:#e0457b; --accent-soft:#3a1d27; --ok:#5fcf8f; --ok-soft:#1b3326; --warn:#f0b35a; --err:#ff7a6e; }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line); }
  .bar { max-width:1200px; margin:0 auto; padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; margin-right:auto; }
  .meta { color:var(--muted); font-size:12px; }
  button, select, input { font:inherit; color:var(--text); }
  .btn { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:7px 12px; cursor:pointer; }
  .btn:hover { background:var(--soft); }
  .tabs { max-width:1200px; margin:0 auto; padding:0 16px; display:flex; gap:4px; }
  .tab { border:0; background:none; padding:10px 14px; border-bottom:3px solid transparent; cursor:pointer; font-weight:600; color:var(--muted); }
  .tab[aria-selected="true"] { color:var(--accent); border-color:var(--accent); }
  main { max-width:1200px; margin:0 auto; padding:16px; }
  .filters { display:flex; gap:10px; flex-wrap:wrap; align-items:end; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .filters label { display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; color:var(--muted); }
  .filters select, .filters input { min-width:200px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); }
  .filters input { min-width:240px; }
  .chips { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin:16px 0; }
  .chip { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .chip b { display:block; font-size:22px; line-height:1.2; }
  .chip span { color:var(--muted); font-size:12px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; margin:16px 0; overflow:hidden; }
  section h2 { font-size:15px; margin:0; padding:12px 14px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  section h2 small { color:var(--muted); font-weight:400; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:600; background:var(--soft); white-space:nowrap; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  tr.total td { font-weight:700; background:var(--soft); }
  tr.click { cursor:pointer; }
  tr.click:hover td { background:var(--accent-soft); }
  .muted { color:var(--muted); }
  .small { font-size:12px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; font-weight:600; background:var(--soft); white-space:nowrap; }
  .pill.sms { background:var(--accent-soft); color:var(--accent); }
  .pill.ok { background:var(--ok-soft); color:var(--ok); }
  .pill.warn { color:var(--warn); }
  .items { margin:0; padding:0; list-style:none; }
  .items li + li { margin-top:4px; }
  .store-head { background:var(--soft); }
  .empty { padding:24px 14px; color:var(--muted); }
  .note { color:var(--muted); font-size:12px; margin:8px 2px; }
  .err { color:var(--err); }
  @media (max-width: 640px) { .filters select, .filters input { min-width:0; width:100%; } .filters label { width:100%; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Restock report</h1>
    <span class="meta" id="updated">Loading…</span>
    <button class="btn" id="refresh">Refresh</button>
    <button class="btn" id="csv">Export CSV</button>
    <button class="btn" id="logout">Sign out</button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="waiting" aria-selected="true">Waiting</button>
    <button class="tab" role="tab" data-tab="notified" aria-selected="false">Notified</button>
  </div>
</header>
<main>
  <div class="filters">
    <label>Store <select id="loc"><option value="">All stores</option></select></label>
    <label>SKU or product <input id="q" type="search" placeholder="Type a SKU or part of a product name"></label>
    <label id="periodWrap" hidden>Notified in
      <select id="period">
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="365">Last 12 months</option>
        <option value="all">All time</option>
      </select>
    </label>
    <button class="btn" id="clear">Clear</button>
  </div>
  <div id="out"></div>
</main>
<script>
(() => {
  const DAY = 86400000;
  const state = { tab: 'waiting', loc: '', q: '', period: '30', data: null };
  const $ = (id) => document.getElementById(id);

  // ── tiny DOM helper (all text goes through textContent) ──
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }

  // ── formatting ──
  const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('en-CA', { timeZone: 'America/Toronto', year: 'numeric', month: 'short', day: 'numeric' }) : '';
  const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString('en-CA', { timeZone: 'America/Toronto', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
  const days = (from, to) => (from ? Math.max(0, ((to ? new Date(to) : new Date()) - new Date(from)) / DAY) : null);
  const fmtDays = (d) => d == null ? '' : d < 1 ? '< 1 day' : `${Math.floor(d)} day${Math.floor(d) === 1 ? '' : 's'}`;
  const avg = (xs) => { const v = xs.filter((x) => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const fmtAvg = (d) => d == null ? '' : `${d.toFixed(1)} d`;
  const distinct = (rows, key) => new Set(rows.map(key)).size;
  const productKey = (r) => r.variantId || r.sku;
  const usedChannel = (r) => r.notifiedChannel || r.channel;

  let storeNames = new Map();
  const storeLabel = (code) => { const n = storeNames.get(code); return n ? `${code} · ${n}` : code; };
  const productLabel = (r) => [r.product, r.variant].filter(Boolean).join(' – ');

  function channelPill(r, notified) {
    const used = notified ? usedChannel(r) : r.channel;
    const pill = h('span', { class: `pill ${used === 'sms' ? 'sms' : ''}` }, used === 'sms' ? 'SMS' : 'Email');
    if (notified && r.notifiedChannel && r.notifiedChannel !== r.channel) {
      return h('span', {}, pill, ' ', h('span', { class: 'small muted' }, `(asked ${r.channel === 'sms' ? 'SMS' : 'email'})`));
    }
    return pill;
  }

  function stockCell(r) {
    if (r.stock == null) return h('span', { class: 'muted' }, '—');
    const ready = r.needed != null && r.stock >= r.needed;
    return h('span', { class: `pill ${ready ? 'ok' : ''}`, title: ready ? 'Will be notified at the next check' : `Notified when available ≥ ${r.needed}` },
      `${r.stock} / ${r.needed ?? '?'}`);
  }

  function groupBy(rows, key) {
    const m = new Map();
    for (const r of rows) { const k = key(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); }
    return m;
  }

  function table(head, rows, opts = {}) {
    if (!rows.length) return h('div', { class: 'empty' }, opts.empty || 'Nothing to show.');
    return h('div', { class: 'scroll' }, h('table', {},
      h('thead', {}, h('tr', {}, head.map(([label, cls]) => h('th', { class: cls }, label)))),
      h('tbody', {}, rows)));
  }

  const section = (title, sub, body) => h('section', {}, h('h2', {}, title, sub ? h('small', {}, sub) : null), body);
  const chip = (value, label) => h('div', { class: 'chip' }, h('b', {}, value), h('span', {}, label));

  // ── filtering ──
  function matcher(records) {
    const q = state.q.trim().toLowerCase();
    if (!q) return { test: () => true, label: '' };
    const exact = records.some((r) => r.sku.toLowerCase() === q);
    if (exact) return { test: (r) => r.sku.toLowerCase() === q, label: `SKU ${state.q.trim()}` };
    return { test: (r) => r.sku.toLowerCase().includes(q) || productLabel(r).toLowerCase().includes(q), label: `“${state.q.trim()}”` };
  }
  const inStore = (r) => !state.loc || r.store === state.loc;
  const inPeriod = (r) => state.period === 'all' || (r.notifiedAt && Date.now() - new Date(r.notifiedAt) <= Number(state.period) * DAY);

  function matchedProducts(rows) {
    const m = new Map();
    for (const r of rows) if (!m.has(productKey(r))) m.set(productKey(r), r);
    return [...m.values()];
  }

  // ── Waiting tab ──
  function renderWaiting(all) {
    const m = matcher(all);
    const rows = all.filter((r) => r.status === 'pending' && inStore(r) && m.test(r));
    const out = [];

    out.push(h('div', { class: 'chips' },
      chip(rows.length, 'requests waiting'),
      chip(distinct(rows, (r) => r.customerId), 'customers waiting'),
      chip(distinct(rows, productKey), 'products'),
      chip(distinct(rows, (r) => r.store), 'stores'),
      chip(rows.filter((r) => r.stock != null && r.needed != null && r.stock >= r.needed).length, 'in stock now (sent at next check)')));

    if (state.q.trim()) {
      // SKU: per store, waiting now vs. ever
      const ever = all.filter((r) => inStore(r) && m.test(r));
      const stores = [...groupBy(ever, (r) => r.store)].sort((a, b) => a[0].localeCompare(b[0]));
      const trs = stores.map(([store, list]) => {
        const now = list.filter((r) => r.status === 'pending');
        return h('tr', { class: 'click', onclick: () => setFilter({ loc: store }) },
          h('td', {}, storeLabel(store)),
          h('td', { class: 'n' }, distinct(now, (r) => r.customerId)),
          h('td', { class: 'n' }, distinct(list, (r) => r.customerId)),
          h('td', { class: 'n' }, fmtDays(avg(now.map((r) => days(r.requestedAt))))));
      });
      if (stores.length > 1) {
        const now = ever.filter((r) => r.status === 'pending');
        trs.push(h('tr', { class: 'total' }, h('td', {}, 'All stores'),
          h('td', { class: 'n' }, distinct(now, (r) => r.customerId)),
          h('td', { class: 'n' }, distinct(ever, (r) => r.customerId)),
          h('td', { class: 'n' }, fmtDays(avg(now.map((r) => days(r.requestedAt)))))));
      }
      const prods = matchedProducts(ever);
      out.push(section(`Customers waiting for ${m.label}`,
        prods.length ? prods.slice(0, 4).map((r) => `${r.sku} ${productLabel(r)}`).join(' · ') + (prods.length > 4 ? ` · +${prods.length - 4} more` : '') : '',
        table([['Store'], ['Waiting now', 'n'], ['Ever waited (incl. notified)', 'n'], ['Average wait so far', 'n']], trs,
          { empty: 'Nobody has ever asked for this.' })));
    } else if (state.loc) {
      // Store: products waited for
      const prods = [...groupBy(rows, productKey)].map(([, list]) => list)
        .sort((a, b) => distinct(b, (r) => r.customerId) - distinct(a, (r) => r.customerId) || a[0].sku.localeCompare(b[0].sku));
      out.push(section(`Products waited for at ${storeLabel(state.loc)}`, 'most waited first',
        table([['SKU'], ['Product'], ['Vendor'], ['Customers', 'n'], ['Longest wait', 'n'], ['Stock now / needed', 'n']],
          prods.map((list) => {
            const r = list[0];
            return h('tr', { class: 'click', onclick: () => setFilter({ q: r.sku }) },
              h('td', {}, r.sku), h('td', {}, productLabel(r)), h('td', {}, r.vendor),
              h('td', { class: 'n' }, distinct(list, (x) => x.customerId)),
              h('td', { class: 'n' }, fmtDays(Math.max(...list.map((x) => days(x.requestedAt) ?? 0)))),
              h('td', { class: 'n' }, stockCell(r)));
          }), { empty: 'Nothing is waited for at this store.' })));
    } else {
      // Home: stores overview
      const stores = [...groupBy(rows, (r) => r.store)].sort((a, b) => b[1].length - a[1].length);
      out.push(section('Stores', 'tap a store to see its products',
        table([['Store'], ['Requests', 'n'], ['Customers', 'n'], ['Products', 'n'], ['Longest wait', 'n']],
          stores.map(([store, list]) => h('tr', { class: 'click', onclick: () => setFilter({ loc: store }) },
            h('td', {}, storeLabel(store)),
            h('td', { class: 'n' }, list.length),
            h('td', { class: 'n' }, distinct(list, (r) => r.customerId)),
            h('td', { class: 'n' }, distinct(list, productKey)),
            h('td', { class: 'n' }, fmtDays(Math.max(...list.map((r) => days(r.requestedAt) ?? 0))))),
          ), { empty: 'Nobody is waiting right now.' })));
    }

    out.push(customerSections(rows, false));
    return out;
  }

  // ── Notified tab ──
  function renderNotified(all) {
    const m = matcher(all);
    const rows = all.filter((r) => r.status === 'notified' && inStore(r) && inPeriod(r) && m.test(r));
    const waits = rows.map((r) => days(r.requestedAt, r.notifiedAt));
    const out = [];

    out.push(h('div', { class: 'chips' },
      chip(rows.length, 'products notified'),
      chip(distinct(rows, (r) => r.customerId), 'customers notified'),
      chip(distinct(rows, productKey), 'different products'),
      chip(fmtAvg(avg(waits)) || '—', 'average wait (asked → notified)'),
      chip(`${rows.filter((r) => usedChannel(r) === 'email').length} / ${rows.filter((r) => usedChannel(r) === 'sms').length}`, 'by email / by SMS'),
      chip(rows.filter((r) => r.notifiedChannel === 'email' && r.channel === 'sms').length, 'asked SMS, sent by email')));

    const stats = (list) => [
      h('td', { class: 'n' }, distinct(list, (r) => r.customerId)),
      h('td', { class: 'n' }, list.length),
      h('td', { class: 'n' }, list.filter((r) => usedChannel(r) === 'email').length),
      h('td', { class: 'n' }, list.filter((r) => usedChannel(r) === 'sms').length),
      h('td', { class: 'n' }, fmtAvg(avg(list.map((r) => days(r.requestedAt, r.notifiedAt))))),
    ];
    const statHead = [['Customers', 'n'], ['Notifications', 'n'], ['Email', 'n'], ['SMS', 'n'], ['Average wait', 'n']];

    if (state.q.trim()) {
      const stores = [...groupBy(rows, (r) => r.store)].sort((a, b) => a[0].localeCompare(b[0]));
      const trs = stores.map(([store, list]) => h('tr', { class: 'click', onclick: () => setFilter({ loc: store }) }, h('td', {}, storeLabel(store)), stats(list)));
      if (stores.length > 1) trs.push(h('tr', { class: 'total' }, h('td', {}, 'All stores'), stats(rows)));
      const prods = matchedProducts(rows);
      out.push(section(`Notifications for ${m.label}`,
        prods.slice(0, 4).map((r) => `${r.sku} ${productLabel(r)}`).join(' · ') + (prods.length > 4 ? ` · +${prods.length - 4} more` : ''),
        table([['Store'], ...statHead], trs, { empty: 'No notification in this period.' })));
    } else if (state.loc) {
      const prods = [...groupBy(rows, productKey)].map(([, list]) => list)
        .sort((a, b) => distinct(b, (r) => r.customerId) - distinct(a, (r) => r.customerId) || a[0].sku.localeCompare(b[0].sku));
      out.push(section(`Products notified at ${storeLabel(state.loc)}`, 'most notified first',
        table([['SKU'], ['Product'], ['Vendor'], ...statHead, ['Last notified', 'n']],
          prods.map((list) => {
            const r = list[0];
            const last = list.map((x) => x.notifiedAt).sort().pop();
            return h('tr', { class: 'click', onclick: () => setFilter({ q: r.sku }) },
              h('td', {}, r.sku), h('td', {}, productLabel(r)), h('td', {}, r.vendor), stats(list), h('td', { class: 'n' }, fmtDate(last)));
          }), { empty: 'No notification in this period.' })));
    } else {
      const stores = [...groupBy(rows, (r) => r.store)].sort((a, b) => b[1].length - a[1].length);
      out.push(section('Stores', 'tap a store to see its products',
        table([['Store'], ...statHead, ['Products', 'n']],
          stores.map(([store, list]) => h('tr', { class: 'click', onclick: () => setFilter({ loc: store }) },
            h('td', {}, storeLabel(store)), stats(list), h('td', { class: 'n' }, distinct(list, productKey)))),
          { empty: 'No notification in this period.' })));
    }

    out.push(customerSections(rows, true));
    return out;
  }

  // ── Per store → per customer detail ──
  function customerSections(rows, notified) {
    const wrap = h('div', {});
    const stores = [...groupBy(rows, (r) => r.store)].sort((a, b) => a[0].localeCompare(b[0]));
    for (const [store, list] of stores) {
      const customers = [...groupBy(list, (r) => r.customerId)].sort((a, b) =>
        notified ? (b[1].map((r) => r.notifiedAt).sort().pop() || '').localeCompare(a[1].map((r) => r.notifiedAt).sort().pop() || '')
                 : (a[1].map((r) => r.requestedAt).sort()[0] || '').localeCompare(b[1].map((r) => r.requestedAt).sort()[0] || ''));
      const trs = customers.map(([, items]) => {
        const c = items[0];
        return h('tr', {},
          h('td', {}, h('div', {}, c.customerName), h('div', { class: 'small muted' }, [c.phone, c.email].filter(Boolean).join(' · '))),
          h('td', {}, h('ul', { class: 'items' }, items
            .sort((a, b) => (notified ? b.notifiedAt : a.requestedAt).localeCompare(notified ? a.notifiedAt : b.requestedAt))
            .map((r) => h('li', {},
              h('div', {}, productLabel(r) || '(deleted product)', ' ', channelPill(r, notified)),
              h('div', { class: 'small muted' }, notified
                ? `${r.sku} · asked ${fmtDate(r.requestedAt)} · notified ${fmtDateTime(r.notifiedAt)} · waited ${fmtDays(days(r.requestedAt, r.notifiedAt))}`
                : `${r.sku} · asked ${fmtDate(r.requestedAt)} · waiting ${fmtDays(days(r.requestedAt))}`),
              !notified && r.stock != null ? h('div', { class: 'small' }, 'Stock now / needed: ', stockCell(r)) : null)))));
      });
      wrap.append(section(storeLabel(store),
        `${customers.length} customer${customers.length === 1 ? '' : 's'} · ${list.length} product${list.length === 1 ? '' : 's'}`,
        table([['Customer'], [notified ? 'Notified products' : 'Waiting for']], trs)));
    }
    if (!stores.length) wrap.append(h('p', { class: 'note' }, notified ? 'No notification matches these filters.' : 'Nobody matches these filters.'));
    return wrap;
  }

  // ── CSV of the rows behind the current view ──
  function currentRows() {
    const all = state.data?.records || [];
    const m = matcher(all);
    return state.tab === 'waiting'
      ? all.filter((r) => r.status === 'pending' && inStore(r) && m.test(r))
      : all.filter((r) => r.status === 'notified' && inStore(r) && inPeriod(r) && m.test(r));
  }

  function exportCsv() {
    const cols = [
      ['store', (r) => r.store], ['store_name', (r) => storeNames.get(r.store) || ''], ['status', (r) => r.status],
      ['sku', (r) => r.sku], ['product', (r) => r.product], ['variant', (r) => r.variant], ['vendor', (r) => r.vendor], ['product_type', (r) => r.productType],
      ['customer', (r) => r.customerName], ['phone', (r) => r.phone], ['email', (r) => r.email],
      ['asked_channel', (r) => r.channel], ['notified_channel', (r) => r.status === 'notified' ? usedChannel(r) : ''],
      ['requested_at', (r) => r.requestedAt], ['notified_at', (r) => r.notifiedAt],
      ['days_waited', (r) => { const d = days(r.requestedAt, r.status === 'notified' ? r.notifiedAt : null); return d == null ? '' : d.toFixed(1); }],
      ['stock_now', (r) => r.stock ?? ''], ['stock_needed', (r) => r.needed ?? ''], ['available_at_notify', (r) => r.availableAtNotify ?? ''],
    ];
    const esc = (v) => { let s = String(v ?? ''); if (/^([=@\t\r]|[+-](?![\d ]))/.test(s)) s = `'${s}`; /* no spreadsheet formulas */ return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const lines = [cols.map((c) => c[0]).join(','), ...currentRows().map((r) => cols.map((c) => esc(c[1](r))).join(','))];
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = h('a', { href: URL.createObjectURL(blob), download: `restock-${state.tab}-${new Date().toISOString().slice(0, 10)}.csv` });
    document.body.append(a); a.click(); a.remove();
  }

  // ── wiring ──
  function render() {
    for (const t of document.querySelectorAll('.tab')) t.setAttribute('aria-selected', String(t.dataset.tab === state.tab));
    $('periodWrap').hidden = state.tab !== 'notified';
    $('loc').value = state.loc; if ($('q').value !== state.q) $('q').value = state.q; $('period').value = state.period;
    const out = $('out');
    out.replaceChildren();
    if (!state.data) return;
    out.append(...(state.tab === 'waiting' ? renderWaiting(state.data.records) : renderNotified(state.data.records)));
  }

  function setFilter(patch) { Object.assign(state, patch); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

  async function load(refresh) {
    $('updated').textContent = 'Loading…';
    try {
      const r = await fetch(`/report/data${refresh ? '?refresh=1' : ''}`, { credentials: 'same-origin' });
      if (r.status === 401) { location.reload(); return; }
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || `Error ${r.status}`);
      state.data = d;
      storeNames = new Map(d.locations.map((l) => [l.code, l.name]));
      const used = new Set(d.records.map((x) => x.store));
      const sel = $('loc');
      sel.replaceChildren(h('option', { value: '' }, 'All stores'),
        ...d.locations.filter((l) => l.active || used.has(l.code)).sort((a, b) => a.code.localeCompare(b.code))
          .map((l) => h('option', { value: l.code }, l.name ? `${l.code} · ${l.name}` : l.code)));
      $('updated').textContent = `Updated ${fmtDateTime(d.generatedAt)}`;
      render();
    } catch (err) {
      $('updated').textContent = '';
      $('out').replaceChildren(h('p', { class: 'err' }, `Could not load the report: ${err.message}`));
    }
  }

  for (const t of document.querySelectorAll('.tab')) t.addEventListener('click', () => setFilter({ tab: t.dataset.tab }));
  $('loc').addEventListener('change', (e) => setFilter({ loc: e.target.value }));
  let timer;
  $('q').addEventListener('input', (e) => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value; render(); }, 250); });
  $('period').addEventListener('change', (e) => setFilter({ period: e.target.value }));
  $('clear').addEventListener('click', () => setFilter({ loc: '', q: '' }));
  $('refresh').addEventListener('click', () => load(true));
  $('csv').addEventListener('click', exportCsv);
  $('logout').addEventListener('click', async () => { await fetch('/report/logout', { method: 'POST' }); location.reload(); });
  load(false);
})();
</script>
</body>
</html>
