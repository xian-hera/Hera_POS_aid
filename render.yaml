# Render service for Hera_POS_aid.
# NOTE: keep `name: search` — the service display name can be changed in the Render
# dashboard. The URL search-0wf4.onrender.com must never change: every Apple Wallet
# card already issued points to it.
services:
  - type: web
    name: search
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: SHOP_DOMAIN
        sync: false
      - key: SHOP_ACCESS_TOKEN
        sync: false
      - key: QR_SECRET
        sync: false
      - key: SMILE_API_KEY
        sync: false
      - key: KLAVIYO_API_KEY
        sync: false
      - key: WWDR_PEM_B64
        sync: false
      - key: SIGNER_CERT_B64
        sync: false
      - key: SIGNER_KEY_B64
        sync: false
      # Physical gift cards: GIFT_SECRET (32+ random characters) turns the feature on.
      # Never change it once cards are printed: it links each card's two codes.
      - key: GIFT_SECRET
        sync: false
      # Optional: refuse to activate a card above this amount (default 2000)
      - key: GIFT_MAX_AMOUNT
        sync: false
      # Optional: refuse gift card orders in another currency, e.g. CAD
      - key: GIFT_CURRENCY
        sync: false
      # Optional switches (defaults: POS_AUTH_MODE=log, LEGACY_WALLET_LINKS=on)
      - key: POS_AUTH_MODE
        sync: false
      - key: LEGACY_WALLET_LINKS
        sync: false
