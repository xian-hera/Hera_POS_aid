api_version = "2026-07"

[[extensions]]
type = "ui_extension"
name = "Points probe"
# `uid` is added automatically by `shopify app deploy` the first time
handle = "points-probe"
description = "Test only: checks that a background POS extension starts by itself and sees cart changes. Sends short lines to the Render log; writes nothing."

[[extensions.targeting]]
module = "./src/index.js"
target = "pos.app.ready.data"
