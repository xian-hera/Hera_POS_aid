api_version = "2026-07"

[[extensions]]
type = "ui_extension"
# Merchant-facing name (shown in the checkout editor)
name = "Unit No. Alert"
handle = "unit-check"
uid = "d0cb15d3-6c0b-2923-7ebd-ca373ed4b10b6a93e3d5"
# `uid` is added automatically by `shopify app deploy` the first time
description = "Thank you / Order status page: asks for the unit number when the building has several units (see address.js)"

[[extensions.targeting]]
module = "./src/ThankYou.jsx"
target = "purchase.thank-you.block.render"

[[extensions.targeting]]
module = "./src/OrderStatus.jsx"
target = "customer-account.order-status.block.render"

[extensions.capabilities]
# Calls the Hera_POS_aid backend (/api/unit/status, /api/unit/answer)
network_access = true

# Style settings shown in the checkout editor (empty = default = first choice).
# Fixed: critical banner, pill neutral / base. Texts live in the metaobject "Unit No. Alert texts".
[extensions.settings]

[[extensions.settings.fields]]
key = "title_layout"
type = "single_line_text_field"
name = "Title layout"
description = "banner = the banner's own title, pill below it with an icon. inline = pill and title on the same line (pill without icon)."
[[extensions.settings.fields.validations]]
name = "choices"
value = "[\"banner\", \"inline\"]"

[[extensions.settings.fields]]
key = "show_pill"
type = "boolean"
name = "Show the pill"
description = "Default: shown. Texts: Shopify admin > Content > Metaobjects > Unit No. Alert texts (also linked under the block preview)."

[[extensions.settings.fields]]
key = "button_width"
type = "single_line_text_field"
name = "Button width (all buttons)"
description = "fit = as wide as the text, fill = full width"
[[extensions.settings.fields.validations]]
name = "choices"
value = "[\"fit\", \"fill\"]"

[[extensions.settings.fields]]
key = "primary_variant"
type = "single_line_text_field"
name = "Save / Confirm buttons: style"
[[extensions.settings.fields.validations]]
name = "choices"
value = "[\"primary\", \"secondary\"]"

[[extensions.settings.fields]]
key = "primary_tone"
type = "single_line_text_field"
name = "Save / Confirm buttons: color"
description = "auto = follows the red banner, neutral = black, critical = red"
[[extensions.settings.fields.validations]]
name = "choices"
value = "[\"auto\", \"neutral\", \"critical\"]"

[[extensions.settings.fields]]
key = "secondary_variant"
type = "single_line_text_field"
name = "No unit number / Back buttons: style"
[[extensions.settings.fields.validations]]
name = "choices"
value = "[\"secondary\", \"primary\"]"

[[extensions.settings.fields]]
key = "secondary_tone"
type = "single_line_text_field"
name = "No unit number / Back buttons: color"
description = "auto = follows the red banner, neutral = black, critical = red"
[[extensions.settings.fields.validations]]
name = "choices"
value = "[\"auto\", \"neutral\", \"critical\"]"

[[extensions.settings.fields]]
key = "body_tone"
type = "single_line_text_field"
name = "Text color"
description = "Main text and the confirmation text. Texts: Shopify admin > Content > Metaobjects > Unit No. Alert texts (also linked under the block preview)."
[[extensions.settings.fields.validations]]
name = "choices"
value = "[\"base\", \"subdued\", \"critical\", \"warning\", \"info\", \"success\"]"
