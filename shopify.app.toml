# Hera_POS_aid — Hera Beauté's own Shopify POS tools + Apple Wallet loyalty card backend.
# This is the former "Search" app (same client_id). Keep the client_id: the backend's
# SHOP_ACCESS_TOKEN and the orders/paid webhook belong to this app.

client_id = "4ef1ce49f9f58d050c762000e78ecf71"
name = "Hera_POS_aid"
application_url = "https://search-0wf4.onrender.com"
embedded = true

[build]
# false so that `shopify app dev` never replaces the production URLs with a tunnel
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["orders/paid"]
  uri = "/webhooks/orders"

[access_scopes]
# Keep in sync with SCOPES in server.js (restock scopes: RESTOCK_SCOPES in restock.js)
scopes = "read_customers,write_customers,read_orders,write_app_proxy,read_gift_cards,write_gift_cards,read_products,read_inventory,read_locations,read_metaobjects,write_metaobjects,read_metaobject_definitions,write_metaobject_definitions"

[auth]
redirect_urls = [ "https://search-0wf4.onrender.com/auth/callback" ]

# Storefront page for the "Add to Apple Wallet" button: https://<store>/apps/hera/wallet
[app_proxy]
url = "https://search-0wf4.onrender.com/proxy"
prefix = "apps"
subpath = "hera"
